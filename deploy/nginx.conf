worker_processes 1;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 30;
    # Exclude query strings, which can contain SignalR bearer tokens.
    log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log safe;
    client_max_body_size 1m;
    limit_req_zone $binary_remote_addr zone=api_general:1m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:1m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_media:1m rate=10r/m;
    limit_req_status 429;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # Only a trusted TLS-terminating ALB may reach port80 (enforce in EC2 SG).
    map $http_x_forwarded_proto $forwarded_proto { https https; default http; }
    upstream frontend { server frontend:3000; keepalive 4; }
    upstream api { server api:8080; keepalive 8; }

    server {
        listen 80;
        server_name www.${DOMAIN};
        return 301 https://${DOMAIN}$request_uri;
    }
    server {
        listen 80 default_server;
        server_name ${DOMAIN};
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy 'accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()' always;
        add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://${DOMAIN} wss://${DOMAIN}; frame-ancestors 'none';" always;

        # Infrastructure health reflects actual API database/cache readiness.
        location = /health {
            access_log off;
            proxy_pass http://api/health/ready;
            proxy_set_header Host api;
        }
        location = /nginx-health { access_log off; return 200 'ok'; }
        # Internal service-key endpoints and metrics never pass the public edge.
        location ~* ^/api/v[0-9]+/agent/internal(?:/|$) { return 404; }
        location ~* ^/health/ { return 404; }
        location ~* ^/metrics(?:/|$) { return 404; }

        if ($http_x_forwarded_proto = http) { return 301 https://$host$request_uri; }

        location ~ ^/api/v[0-9]+/auth/(login|register|refresh-token)$ {
            limit_req zone=api_auth burst=3 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection '';
        }
        location ~ ^/api/v[0-9]+/media/upload {
            client_max_body_size 20m;
            limit_req zone=api_media burst=5 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection '';
        }
        location /api {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection '';
            proxy_read_timeout 120s;
        }
        # Both /hubs/agent-runs and /hubs/public-cache; negotiate and streaming.
        location /hubs/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location ~ ^/(llms\.txt|rss|feed|feed\.xml)$ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection '';
        }
        location /uploads/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection '';
            expires 1d;
        }
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection '';
            expires 1y;
            proxy_hide_header Link;
        }
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection '';
        }
    }
}
