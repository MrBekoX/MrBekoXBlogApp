# Role-separated identities are imported by RabbitMQ core (no management UI).
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions/definitions.json
definitions.skip_if_unchanged = true
vm_memory_high_watermark.absolute = 192MiB
disk_free_limit.absolute = 512MiB
channel_max = 64
heartbeat = 30
collect_statistics_interval = 30000
