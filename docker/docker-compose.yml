name: MrBekoXBlogApp

services:

  # ==========================================
  # PostgreSQL 18 — Primary Database
  # ==========================================
  postgres:
    image: postgres:18.0-alpine
    container_name: blogapp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-blogdb_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-blogdb_dev}" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - backend-net

  # ==========================================
  # Redis 8 — L1/L2 Hybrid Cache
  # ==========================================
  redis:
    image: redis:8.0-alpine
    container_name: blogapp-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  # ==========================================
  # RabbitMQ 4.x — Backend ↔ AI Agent Messaging (B2)
  # ==========================================
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: blogapp-rabbitmq
    environment:
      # Dev varsayılanları düz metin kalabilir; .env ile overrides edilir.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-blogapp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-blogapp_dev}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - backend-net

  # ==========================================
  # .NET 10 Backend — REST API + SignalR Hubs
  # ==========================================
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    image: blogapp-backend:latest
    pull_policy: never
    container_name: blogapp-backend
    environment:
      # ASP.NET Core
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      # Database
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-blogdb_dev};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # JWT
      - JwtSettings__Secret=${JwtSettings__Secret:?JwtSettings__Secret is required}
      - JwtSettings__Issuer=BlogApp
      - JwtSettings__Audience=BlogApp
      - JwtSettings__ExpirationMinutes=20
      # Admin Seed
      - AdminUser__Email=${ADMIN_EMAIL:-admin@example.com}
      - AdminUser__UserName=${ADMIN_USERNAME:-admin}
      - AdminUser__Password=${ADMIN_PASSWORD:-CHANGE_ME_strong_password}
      # Hosting
      - AllowedHosts=${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      - CorsOrigins__0=${CORS_ORIGIN_0:-http://localhost:3000}
      # EF Core Migrations
      - Database__RunMigrationsOnStartup=true
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/uploads
      - backend_keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - frontend-net
      - backend-net

  # ==========================================
  # Next.js 16 Frontend — SSR Standalone
  # ==========================================
  frontend:
    build:
      context: ../src/frontend/blogapp-web
      dockerfile: ../../../docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_SIGNALR_URL: ${PUBLIC_SIGNALR_URL:-http://localhost:8080}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        API_URL: http://backend:8080/api/v1
        REWRITE_URL: http://backend:8080
    image: blogapp-frontend:latest
    pull_policy: never
    container_name: blogapp-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api/v1
      - NEXT_PUBLIC_SIGNALR_URL=${PUBLIC_SIGNALR_URL:-http://localhost:8080}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - API_URL=http://backend:8080/api/v1
      - REWRITE_URL=http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - frontend-net

# ==========================================
# Networks
# ==========================================
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  backend_uploads:
  backend_keys:
