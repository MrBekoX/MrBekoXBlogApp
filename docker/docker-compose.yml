name: MrBekoXBlogApp

services:

  # ==========================================
  # PostgreSQL 18 — Primary Database
  # ==========================================
  postgres:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    container_name: blogapp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-blogdb_dev}
      # Keep the existing local volume path explicit with the PG18 image.
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-blogdb_dev}" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - backend-net

  # ==========================================
  # Redis 8 — L1/L2 Hybrid Cache
  # ==========================================
  redis:
    image: redis:8.0-alpine@sha256:5f61955be8ab2ccee9372b84ae4d4da2e2b156f87281e3f218544055e7ee04d4
    container_name: blogapp-redis
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  # ==========================================
  # RabbitMQ 4.x — Backend ↔ AI Agent Messaging (B2; B11 sürüm kilidi)
  # ==========================================
  # Sürüm kilidi (plan satır 557): broker imgesi 4.3.6'a SABİTLENMİŞTİR
  # ("4.3-management" yüzen etiketi ile istemci sürümleri
  # RabbitMQ.Client 7.2.2 / aio-pika 9.5.8 arasındaki uyum koşulu
  # sürüklenmesin). Tag registry'de doğrulandı (B11). Yükseltme
  # operations/topoloji-ve-surum-kilidi.md adımlarıyla yapılır.
  #
  # Ağ sınırı (plan satır 560): AMQP (5672) ve management UI (15672) yalnız
  # 127.0.0.1'e bound — broker'a ve yönetim arayüzüne yalnız host erişir;
  # frontend-net/backend-net köprüleri dışından yayın yok. Üretimde management
  # portu YA hiç yayınlanmalı YA ayrı bir yönetim ağında tutulmalı
  # (operations/topoloji-ve-surum-kilidi.md §4).
  #
  rabbitmq:
    image: rabbitmq:4.3.6-management@sha256:54cb013d76cd1fd6c0a0708f34062ad61c452bb6f016b434c6c33f1a765d2b58
    container_name: blogapp-rabbitmq
    environment:
      # Explicit local credentials; production uses isolated runtime roles.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - backend-net

  # ==========================================
  # .NET 10 Backend — REST API + SignalR Hubs
  # ==========================================
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    image: blogapp-backend:latest
    pull_policy: never
    container_name: blogapp-backend
    environment:
      # ASP.NET Core
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      # Database
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-blogdb_dev};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # JWT
      - JwtSettings__Secret=${JwtSettings__Secret:?JwtSettings__Secret is required}
      - JwtSettings__Issuer=BlogApp
      - JwtSettings__Audience=BlogApp
      - JwtSettings__ExpirationMinutes=20
      # Admin Seed
      - AdminUser__Email=${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      - AdminUser__UserName=${ADMIN_USERNAME:-admin}
      - AdminUser__Password=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      # Hosting
      - AllowedHosts=${ALLOWED_HOSTS:?ALLOWED_HOSTS is required};backend;localhost;127.0.0.1
      - CorsOrigins__0=${CORS_ORIGIN_0:-http://localhost:3000}
      # EF Core Migrations
      - Database__RunMigrationsOnStartup=true
      - AgentService__InternalApiKey=${AGENT_CONTENT_SERVICE_KEY:?AGENT_CONTENT_SERVICE_KEY is required}
      - AuthorProfile__Directory=/app/content/author-profile
      - AgentWireV2__Enabled=true
      - AgentContentSync__Enabled=true
      - RabbitMq__Host=rabbitmq
      - RabbitMq__VirtualHost=/
      - RabbitMq__UserName=${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      - RabbitMq__Password=${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
      - AgentAcceptance__MaxActiveRunsTotal=5
      - AgentAcceptance__MaxActiveRunsPerOwner=1
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/uploads
      - backend_keys:/app/keys
      - type: bind
        source: ${AUTHOR_PROFILE_HOST_DIR:-../private/production-author-profile}
        target: /app/content/author-profile
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      agent-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # B11 (plan satır 558/561): yalnız BAŞLANGIÇ SIRALAMASI — broker sağlık
      # koşulu backend'i broker kapalıyken düşürmez (K3: kabul yolu DB outbox'ı;
      # broker yoksa relay kendi döngüsünde bekler). Container liveness'ı
      # /health/live'dır: bağımlılık denetlemez, broker kesintisi restart üretmez.
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # B11: liveness ayrımı — /health bağımlılık denetimleri içerir; container
      # tekrar başlatma kararı yalnız "süreç yanıtlıyor mu" sorusuna bağlanır.
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - frontend-net
      - backend-net

  # The worker always uses real providers; missing credentials stop composition.
  agent-migrate:
    build:
      context: ..
      dockerfile: docker/ai-agent-service/Dockerfile
    image: blogapp-ai-agent:local
    command: ["python", "-m", "alembic", "-c", "migrations/alembic.ini", "upgrade", "head"]
    environment: &agent-db
      AGENT_DB_HOST: postgres
      AGENT_DB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      AGENT_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AGENT_DB_NAME: ${POSTGRES_DB:-blogdb_dev}
      AGENT_DB_SCHEMA: agent
      AGENT_DB_POOL_MIN: "1"
      AGENT_DB_POOL_MAX: "3"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend-net]
    restart: "no"

  ai-agent:
    build:
      context: ..
      dockerfile: docker/ai-agent-service/Dockerfile
    image: blogapp-ai-agent:local
    init: true
    environment:
      <<: *agent-db
      AGENT_ENV_FILE: /dev/null
      AGENT_BROKER_HOST: rabbitmq
      AGENT_BROKER_VHOST: /
      AGENT_BROKER_USERNAME: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      AGENT_BROKER_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
      AGENT_BROKER_PREFETCH: "1"
      AGENT_TOPOLOGY_DECLARE: "false"
      AGENT_CANONICAL_URL_TEMPLATE: "http://localhost:${FRONTEND_PORT:-3000}/posts/{slug}"
      AGENT_CONTENT_BASE_URL: http://backend:8080/api/v1
      AGENT_PROFILE_DIR: /srv/content/author-profile
      AGENT_CONTENT_SERVICE_KEY: ${AGENT_CONTENT_SERVICE_KEY:?AGENT_CONTENT_SERVICE_KEY is required}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:?AGENT_LLM_API_KEY is required}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-https://api.openai.com/v1}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:?AGENT_LLM_MODEL is required}
      AGENT_EMBEDDING_API_KEY: ${AGENT_EMBEDDING_API_KEY:-}
      AGENT_EMBEDDING_BASE_URL: ${AGENT_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      AGENT_EMBEDDING_MODEL: text-embedding-3-small
      AGENT_EMBEDDING_DIMENSIONS: "1536"
      AGENT_WORKER_QUEUE_CLASSES: fast,research
    volumes:
      - agent_state:/srv/ai-agent-service/.agent_checkpoints
      - type: bind
        source: ${AUTHOR_PROFILE_HOST_DIR:-../private/production-author-profile}
        target: /srv/content/author-profile
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
      agent-migrate:
        condition: service_completed_successfully
    networks: [backend-net]
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 120s

  # ==========================================
  # Next.js 16 Frontend — SSR Standalone
  # ==========================================
  frontend:
    build:
      context: ../src/frontend/blogapp-web
      dockerfile: ../../../docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_SIGNALR_URL: ${PUBLIC_SIGNALR_URL:-http://localhost:8080}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_SITE_URL: http://localhost:${FRONTEND_PORT:-3000}
        NEXT_PUBLIC_AUTHOR_NAME: ${PUBLIC_AUTHOR_NAME:?PUBLIC_AUTHOR_NAME is required}
        NEXT_PUBLIC_GITHUB_URL: ${PUBLIC_GITHUB_URL:-}
        NEXT_PUBLIC_TWITTER_URL: ${PUBLIC_TWITTER_URL:-}
        NEXT_PUBLIC_LINKEDIN_URL: ${PUBLIC_LINKEDIN_URL:-}
        NEXT_PUBLIC_TWITTER_HANDLE: ${PUBLIC_TWITTER_HANDLE:-}
        API_URL: http://backend:8080/api/v1
        REWRITE_URL: http://backend:8080
    image: blogapp-frontend:latest
    pull_policy: never
    container_name: blogapp-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api/v1
      - NEXT_PUBLIC_SIGNALR_URL=${PUBLIC_SIGNALR_URL:-http://localhost:8080}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - API_URL=http://backend:8080/api/v1
      - REWRITE_URL=http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - frontend-net

# ==========================================
# Networks
# ==========================================
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  backend_uploads:
  backend_keys:
  agent_state:
