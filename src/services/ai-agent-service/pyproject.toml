[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-service"
version = "0.1.0"
description = "MrBekoX Blog AI agent cekirdegi (agent_core) ve transport katmani (messaging): is modelleri, portlar, giris noktalari, mesaj sozlesmeleri"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11,<3",
    "langgraph>=1.0,<2",
    "aio-pika>=9.5,<10",
    # B4 kalıcı iş kabulü: async sürücü + migration aracı (Alembic 1.20.0 resmî
    # belge: SQLAlchemy 2.0+ gerekir; SQLAlchemy migration zamanı aracıdır,
    # çalışma zamanı yolu asyncpg kullanır).
    "asyncpg>=0.32,<0.33",
    "alembic>=1.20,<1.21",
    "sqlalchemy>=2.0,<2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
where = ["app"]
include = ["agent_core*", "messaging*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
