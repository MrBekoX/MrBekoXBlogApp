[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-service"
version = "0.1.0"
description = "MrBekoX Blog AI agent cekirdegi (agent_core) ve transport katmani (messaging): is modelleri, portlar, giris noktalari, mesaj sozlesmeleri"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
where = ["app"]
include = ["agent_core*", "messaging*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
