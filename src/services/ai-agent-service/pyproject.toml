[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-service"
version = "0.1.0"
description = "MrBekoX Blog AI agent cekirdegi (agent_core) ve transport katmani (messaging): is modelleri, portlar, giris noktalari, mesaj sozlesmeleri"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11,<3",
    "langgraph>=1.0,<2",
    "aio-pika>=9.5,<10",
    # B4 kalıcı iş kabulü: async sürücü + migration aracı (Alembic 1.20.0 resmî
    # belge: SQLAlchemy 2.0+ gerekir; SQLAlchemy migration zamanı aracıdır,
    # çalışma zamanı yolu asyncpg kullanır).
    "asyncpg>=0.32,<0.33",
    # HTTP transport for production chat and embedding providers.
    "httpx>=0.27,<1",
    "alembic>=1.20,<1.21",
    "sqlalchemy>=2.0,<2.1",
]

[project.optional-dependencies]
storage-test = ["embedded-postgres==18.6.3"]
dev = [
    "pytest>=8.3",
    # Sözleşme testleri fixture'ları gerçek JSON Schema dosyalarına (Draft 2020-12,
    # v1 + v2) karşı da doğrular; referencing kayıt sınıfı 4.18+ ile gelir.
    "jsonschema>=4.18",
]

[tool.setuptools]
# agent_core.adapters.config üst seviye ``env_file`` modülünü import eder;
# kurulu pakette de bulunması için tek-dosya modül olarak paketlenir.
package-dir = {"" = "app"}
py-modules = ["env_file"]

[tool.setuptools.packages.find]
where = ["app"]
include = ["agent_core*", "messaging*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
